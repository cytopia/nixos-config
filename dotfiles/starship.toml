[direnv]
disabled = false

[aws]
#format = 'on [$symbol($profile )(\($region\) )]($style)'
style = 'bold blue'
symbol = '🅰 '
force_display = false
[aws.profile_aliases]
#test = 'login'
#login = 'wwwwooowww'

[kubernetes]
symbol = "󱃾 "
disabled = true
style = "fg:#326ce5"
format = 'at [$symbol$context\($namespace\)]($style) '
[kubernetes.context_aliases]
"arn:aws:eks:eu-central-1:608780100653:cluster.*" = "k8s-blues"
"arn:aws:eks:eu-central-1:558030440183:cluster.*" = "k8s-common"


[nix_shell]
symbol = "󱄅 "
style = "fg:#7ebae4"
impure_msg = ""
pure_msg = "pure "
unknown_msg = "unknown "
format = 'via [$symbol$state\($name\)]($style) '



[directory]
truncation_length = 0
truncate_to_repo = false

[custom.aws]
command = '/home/cytopia/saml2aws.sh default'
style = 'dimmed blue'
format = '[$output]($style) '
when = true
